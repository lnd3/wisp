# Production compose stack for wisp (wisp.mera.network) — copied and
# adapted from persona's own deploy/docker-compose.yml, itself from
# EphemNet's/cinder's (same server, `bh2`, same convention — cinder's
# D007/P008). Never invoked directly — always via deploy/ops.sh or
# deploy/deploy.sh, which pass `-p wisp-<environment>` (see
# deploy/environments.sh) so "live" and "dev" never collide with each
# other or with any other product's stack on the same host.
#
# Two services: wisp (cmd/wisp: the ingest API, dashboard and landing
# page) on an internal-only network, and wisp-caddy, which terminates TLS
# and reverse-proxies everything to wisp. The landing page is served by
# wisp itself so wisp's own hook can count it (wisp as product "wisp").
#
# Ports and subnet checked LIVE against `bh2` on 2026-09-30 (docker ps,
# docker network ls, ss -tln), not just inferred from other repos'
# docs. Taken at that check: 9180-9184/9443-9447 (cinder live),
# 9190/9450 (EphemNet), 9200/9460 (offgridapp), 9210/9470 (persona).
# wisp takes the next free pair, 9220/9480 (live), 9320/9580 (dev).
#
# Subnet: 172.27.1.0/24 (live) / 172.27.2.0/24 (dev). Deliberately NOT
# continuing persona's 172.32.x — 172.32.0.0/16 is outside RFC 1918's
# 172.16.0.0/12 (i.e. real, public internet address space), so a
# Docker network there shadows real hosts from inside the container.
# 172.27.0.0/16 is private, unused on `bh2` at that check, and below
# the 172.28-172.31 blocks cinder/EphemNet/offgridapp already pinned.
#
# LOCAL TESTING WARNING (same as EphemNet's): WISP_DOMAIN's real value
# is live DNS pointed at `bh2`. Caddy requests a REAL Let's Encrypt
# certificate the moment it starts — for a local dry run, set
# WISP_DOMAIN to something that doesn't resolve (e.g. `wisp.invalid`).

services:
  wisp-caddy:
    image: caddy:2
    environment:
      - WISP_DOMAIN=${WISP_DOMAIN:?set WISP_DOMAIN in deploy/.env}
      - WISP_EDGE_SUBNET=${WISP_EDGE_SUBNET:-172.27.1.0/24}
      # Dashboard Basic Auth — required, no default: Caddy must refuse to
      # start rather than serve the dashboard unauthenticated. See
      # deploy/.env.example for generating the hash (and its $$ escaping).
      - WISP_DASHBOARD_USER=${WISP_DASHBOARD_USER:?set WISP_DASHBOARD_USER in deploy/.env}
      - WISP_DASHBOARD_HASH=${WISP_DASHBOARD_HASH:?set WISP_DASHBOARD_HASH in deploy/.env — see deploy/.env.example}
    volumes:
      - ./wisp-caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - wisp-caddy-data:/data
      - wisp-caddy-config:/config
    ports:
      - "127.0.0.1:${WISP_CADDY_HTTPS_PORT:-9480}:443"
      # HTTP-01 challenge port — see cinder's own D007 Log for why
      # HTTP-01, not TLS-ALPN-01.
      - "127.0.0.1:${WISP_CADDY_HTTP_PORT:-9220}:80"
    networks:
      - wisp-edge
      - wisp-internal
    # Caddy's stderr is kept by Docker's json-file driver on the host —
    # a persisted log. The Caddyfile's global `log` block keeps request
    # details (and so client IPs) out of it; see that file's header.
    restart: unless-stopped

  # The wisp server (cmd/wisp): the ingest API product hooks POST to
  # (/v1/ingest, reverse-proxied by wisp-caddy), plus the staging sweep.
  # No host port: only wisp-caddy can reach it. Its callers are the
  # products' own backends (server-to-server, authenticated per product),
  # never end users' browsers (plan/concepts/C001), so the peer address
  # it sees is a product server's, not a visitor's — and it logs none.
  wisp:
    build:
      context: ..
      dockerfile: deploy/wisp/Dockerfile
    command:
      - "serve"
      - "-addr=:8080"
      - "-data=/data"
      - "-registry=/etc/wisp/products.json"
      # wisp's own landing page, counted by wisp's own hook.
      - "-site=/srv/site"
      # Only wisp-caddy (on wisp-internal) may set the visitor IP via
      # X-Real-IP. Must match wisp-internal's pinned subnet below.
      - "-trusted-proxies=${WISP_INTERNAL_SUBNET:-172.27.11.0/24}"
    environment:
      # wisp's own product token (registered as "wisp" in products.json).
      # Optional: unset, the landing page is served but not counted.
      - WISP_TOKEN=${WISP_TOKEN:-}
    volumes:
      - ../site:/srv/site:ro
      # Server-only registry of product keys + token hashes (see
      # deploy/products.json.example and deploy/README.md). Excluded from
      # deploy.sh's rsync, like deploy/.env. After editing it, restart
      # wisp (ops.sh ... restart wisp).
      - ./products.json:/etc/wisp/products.json:ro
      # Staging files (keyed, day-scoped, deleted at close) and, later,
      # the product statistics DB.
      - wisp-data:/data
    networks:
      - wisp-internal
    restart: unless-stopped

networks:
  # Deliberately just {wisp-caddy} — nothing else ever joins it. Not
  # `internal: true`: Caddy needs outbound internet access for ACME.
  wisp-edge:
    ipam:
      config:
        - subnet: ${WISP_EDGE_SUBNET:-172.27.1.0/24}
  # {wisp-caddy, wisp} only, so the app never sits on the edge network.
  # internal: true — wisp itself needs no outbound internet access at all
  # (its own hook reports over loopback). Pinned, not auto-assigned, so
  # -trusted-proxies above can name it: 172.27.11.0/24 live /
  # 172.27.12.0/24 dev, checked free on bh2 2026-10-01.
  wisp-internal:
    internal: true
    ipam:
      config:
        - subnet: ${WISP_INTERNAL_SUBNET:-172.27.11.0/24}

volumes:
  wisp-caddy-data:
  wisp-caddy-config:
  wisp-data:
