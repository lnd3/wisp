# health-wisp: one machine's disk/memory/load for uptime-wisp's "host"
# check. Never run directly: deploy/health/deploy.sh ships the image and
# runs it as Compose project "health-wisp", plus one overlay, chosen by
# COMPOSE_FILE in the host's .env:
#   docker-compose.tls.yml  internet-facing (bh2): a Caddy sidecar
#                           terminates TLS behind the shared nginx.
#   docker-compose.lan.yml  LAN box (rbserver1): a plain host port.
#
# .env (host-only, never synced) holds HEALTH_HOST, HEALTH_TOKEN_SHA256
# and the overlay's settings; the token itself is in .health-token.

services:
  health-wisp:
    image: health-wisp:current
    command:
      - "-host=${HEALTH_HOST:?set HEALTH_HOST in .env}"
      # Any path on a filesystem reports that filesystem, so this binds
      # one empty directory beside this file (on the host's root disk),
      # never the host's / itself. Add a volume + -disk per extra disk.
      - "-disk=root=/fs/root"
    environment:
      # Required: health-wisp refuses to serve without it.
      - HEALTH_TOKEN_SHA256=${HEALTH_TOKEN_SHA256:?set HEALTH_TOKEN_SHA256 in .env}
    volumes:
      - ./fs-root:/fs/root:ro
    # /proc/loadavg, /proc/meminfo and /proc/stat are host-wide even in
    # a container, so no host /proc mount is needed either.
    networks: [health]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 16m
    pids_limit: 32
    restart: unless-stopped

networks:
  health: {}
