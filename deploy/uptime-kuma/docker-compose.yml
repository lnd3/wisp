# uptime-kuma: wisp's external uptime monitor (P001's health-monitoring
# scope item; tool and ownership decided by the user 2026-10-01).
# Never run directly: deploy/uptime-kuma/deploy.sh syncs this file and
# runs it as Compose project "wisp-uptime-kuma" on whichever host you
# name.
#
# Generic on purpose: the same file works on any host. Monitors,
# notification channels and push/heartbeat URLs are uptime-kuma's own
# state (SQLite under ./data), set up in its web UI after first boot,
# not in this file.
#
# No fixed container_name, so this can coexist with another uptime-kuma
# on the same host: the Compose project name
# keeps it separate, and deploy.sh refuses a port that's already taken.

services:
  uptime-kuma:
    # The maintained 2.x line, slim variant: same app and updates as `2`,
    # without the embedded MariaDB and the Chromium used by "real browser"
    # monitors. About a quarter of the size, which matters on a Pi's SD
    # card. Nothing here needs either: data is SQLite (data/kuma.db), and
    # the README's monitors are HTTP(s)/DNS. Use plain `2` only if you
    # add a browser-based monitor. Don't use `1` or `latest`: both still
    # point at v1, which is end-of-life (no bug or security fixes).
    # Moving from v1 migrates the database one-way, so back up data/
    # before any major-version switch.
    image: louislam/uptime-kuma:2-slim
    restart: unless-stopped
    ports:
      # Set via deploy.sh's --bind/--port (written to .env on the host).
      # The default 0.0.0.0 suits a LAN-only box like rbserver1; on a
      # public server, bind 127.0.0.1 and put a TLS proxy in front.
      - "${KUMA_BIND:-0.0.0.0}:${KUMA_PORT:-3001}:3001"
    volumes:
      # Host directory, not a named volume: easy to back up (copy it
      # while stopped), and it survives `docker compose down`.
      - ./data:/app/data
